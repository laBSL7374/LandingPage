<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merci — Votre demande a bien été envoyée</title>
  <link rel="icon" href="/assets/logo.svg">
  <style>
    
  :root{
    /* === Palette (modifiable) ===
       Remplace ces codes par les codes officiels Valority si besoin */
    --brand:#0e2c63;        /* Navy */
    --brand-2:#15a1a8;      /* Teal accent */
    --ink:#0f172a;
    --muted:#475569;
    --bg:#f6f8fb;
    --card:#ffffff;
    --ring:#dbe3f1;
    --ok:#0ea5e9;
  }

    body{background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);margin:0;padding:0}
    .wrap{max-width:720px;margin:0 auto;padding:40px 16px;text-align:center}
    .card{background:#fff;border:1px solid var(--ring);border-radius:16px;box-shadow:0 10px 28px rgba(2,6,23,.06);padding:26px}
    h1{color:var(--brand)}
    a.btn{display:inline-block;margin-top:16px;background:var(--brand-2);color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/assets/logo.svg" alt="Valority" style="height:40px;margin-bottom:14px">
    <div class="card">
      <h1>✅ Merci !</h1>
      <p>Votre demande a bien été envoyée. Nous revenons vers vous sous 24 heures (jours ouvrés).</p>
      <a class="btn" href="/">Retour à l’accueil</a>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/mentions-legales.html">Mentions légales & RGPD</a></p>
  </div>
</body>
</html>
